spring:
  datasource:
    url: jdbc:h2:mem:continuity_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: continuity-enterprise-secret-key-2026-secure-hmac-sha256
  storage:
    snapshot-dir: ./target/test-snapshots
