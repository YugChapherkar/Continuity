spring:
  datasource:
    url: jdbc:h2:mem:continuity_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  storage:
    snapshot-dir: target/test-storage/snapshots

gemini:
  api-key: ""
  model: gemini-2.5-flash
